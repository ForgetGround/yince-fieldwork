worker_processes 1;
pid /run/yince/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/yince/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 1m;
    client_body_temp_path /run/yince/client_temp;
    proxy_temp_path /run/yince/proxy_temp;
    fastcgi_temp_path /run/yince/fastcgi_temp;
    uwsgi_temp_path /run/yince/uwsgi_temp;
    scgi_temp_path /run/yince/scgi_temp;

    server {
        listen 127.0.0.1:59603;
        server_name yince.xcoria.cn;
        root /srv/yince/current;
        index index.html;

        location = /healthz {
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "yince-ok\n";
        }

        location ~ /\. { return 404; }

        location /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
