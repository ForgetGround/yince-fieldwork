# HTTP-level declarations. Only the Yince virtual host applies these limits.
limit_req_zone $binary_remote_addr zone=yince_api_requests:2m rate=10r/s;
limit_req_zone $binary_remote_addr zone=yince_auth_requests:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=yince_api_connections:1m;
upstream yince_api_backend {
    server unix:/run/yince-api.sock;
    keepalive 8;
}
