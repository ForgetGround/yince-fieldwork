# Install only while obtaining the first certificate, then replace with nginx-site.conf.
server {
    listen 80;
    listen [::]:80;
    server_name yince.xcoria.cn;
    access_log off;
    error_log /var/log/nginx/yince-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yince-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:59603;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
