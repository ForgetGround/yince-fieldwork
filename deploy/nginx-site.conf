server {
    listen 80;
    listen [::]:80;
    server_name yince.xcoria.cn;
    access_log off;
    error_log /var/log/nginx/yince-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yince-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://yince.xcoria.cn$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yince.xcoria.cn;
    ssl_certificate /etc/letsencrypt/live/yince.xcoria.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yince.xcoria.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:YINCE_SSL:1m;
    ssl_session_tickets off;

    access_log off;
    error_log /var/log/nginx/yince-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:59603;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
